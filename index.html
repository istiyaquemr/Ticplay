<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticplay</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    h1 {
      margin-bottom: 10px;
      color: #00e676;
    }
    .scoreboard {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 1.1rem;
      background: #1e1e1e;
      padding: 10px 20px;
      border-radius: 8px;
    }
    #status {
      font-size: 1.3rem;
      margin-bottom: 20px;
      font-weight: bold;
      height: 30px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
      margin-bottom: 20px;
    }
    .cell {
      width: 100px;
      height: 100px;
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 10px;
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .cell:hover:not(:disabled) {
      background-color: #2c2c2c;
    }
    .cell.x {
      color: #29b6f6;
    }
    .cell.o {
      color: #ff7043;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button.btn {
      padding: 10px 18px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background-color: #00e676;
      color: #121212;
    }
    button.btn.reset {
      background-color: #ff5252;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>Ticplay</h1>

  <div class="scoreboard">
    <div>You (X): <span id="scoreX">0</span></div>
    <div>Draws: <span id="draws">0</span></div>
    <div>CPU (O): <span id="scoreO">0</span></div>
  </div>

  <div id="status">Your turn (X)</div>

  <div class="board" id="board">
    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>
    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>
    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <button class="cell" data-index="8"></button>
  </div>

  <div class="controls">
    <button class="btn" id="restart">Restart Game</button>
    <button class="btn reset" id="resetScores">Reset Scores</button>
  </div>

  <script>
    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");

    let board = Array(9).fill("");
    let gameActive = true;
    let scores = { X: 0, O: 0, draws: 0 };

    const winningCombinations = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    cells.forEach(cell => {
      cell.addEventListener("click", () => {
        const index = cell.dataset.index;
        if (!gameActive || board[index] !== "") return;

        makeMove(index, "X");
        if (checkWinner("X")) return;

        if (board.every(value => value !== "")) {
          finishDraw();
          return;
        }

        gameActive = false;
        statusText.textContent = "🤖 Computer is thinking...";
        setTimeout(() => {
          gameActive = true;
          computerMove();
        }, 400);
      });
    });

    function computerMove() {
      const emptyCells = [];
      board.forEach((value, index) => {
        if (value === "") emptyCells.push(index);
      });

      if (emptyCells.length === 0) return;

      const randomIndex = Math.floor(Math.random() * emptyCells.length);
      const computerChoice = emptyCells[randomIndex];

      makeMove(computerChoice, "O");
      if (checkWinner("O")) return;

      if (board.every(value => value !== "")) {
        finishDraw();
        return;
      }

      statusText.textContent = "Your turn (X)";
    }

    function makeMove(index, player) {
      board[index] = player;
      cells[index].textContent = player;
      cells[index].classList.add(player.toLowerCase());
      cells[index].disabled = true;
    }

    function checkWinner(player) {
      const winningCombo = winningCombinations.find(combo =>
        combo.every(index => board[index] === player)
      );

      if (winningCombo) {
        statusText.textContent = player === "X" ? "🎉 You Win!" : "🤖 Computer Wins!";
        scores[player]++;
        updateScores();

        winningCombo.forEach(index => {
          cells[index].style.background = "#166534";
        });

        gameActive = false;
        cells.forEach(cell => cell.disabled = true);
        return true;
      }
      return false;
    }

    function finishDraw() {
      statusText.textContent = "🤝 It's a Draw!";
      scores.draws++;
      updateScores();
      gameActive = false;
    }

    function updateScores() {
      document.getElementById("scoreX").textContent = scores.X;
      document.getElementById("scoreO").textContent = scores.O;
      document.getElementById("draws").textContent = scores.draws;
    }

    function restartGame() {
      board = Array(9).fill("");
      gameActive = true;
      cells.forEach(cell => {
        cell.textContent = "";
        cell.disabled = false;
        cell.className = "cell";
        cell.style.background = "";
      });
      statusText.textContent = "Your turn (X)";
    }

    function resetScores() {
      scores = { X: 0, O: 0, draws: 0 };
      updateScores();
      restartGame();
    }

    document.getElementById("restart").addEventListener("click", restartGame);
    document.getElementById("resetScores").addEventListener("click", resetScores);
  </script>

</body>
</html>
