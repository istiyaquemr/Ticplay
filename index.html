<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play TicXPlay, a fun Tic Tac Toe game for two players.">
  <title>TicXPlay - Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: linear-gradient(135deg, #10172a, #25205a);
    }
    .game {
      width: min(100%, 410px);
      padding: 26px;
      text-align: center;
      background: #1b2440;
      border-radius: 22px;
      box-shadow: 0 15px 40px #0006;
    }
    h1 { margin: 0 0 8px; color: #38bdf8; font-size: 2.35rem; }
    .subtitle { margin: 0; color: #cbd5e1; }
    .scoreboard {
      display: flex;
      justify-content: space-around;
      gap: 8px;
      margin: 24px 0;
      padding: 15px 8px;
      border-radius: 12px;
      background: #111a30;
    }
    .score-label { color: #cbd5e1; font-size: .9rem; }
    .score { margin-top: 6px; font-size: 1.6rem; font-weight: bold; }
    #status { min-height: 26px; margin: 20px 0; color: #facc15; font-weight: bold; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .cell {
      aspect-ratio: 1;
      border: 0;
      border-radius: 14px;
      background: #303e60;
      color: white;
      font-size: clamp(2.5rem, 12vw, 3.3rem);
      font-weight: bold;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .cell:hover:not(:disabled) { background: #405477; transform: scale(1.03); }
    .cell:disabled { cursor: default; }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f472b6; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .action {
      flex: 1;
      padding: 13px 10px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #10172a;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .action:hover { background: #7dd3fc; }
    .secondary { background: #cbd5e1; }
    footer { margin-top: 22px; color: #94a3b8; font-size: .8rem; }
  </style>
</head>
<body>
  <main class="game">
    <h1>TIC X PLAY</h1>
    <p class="subtitle">The Ultimate Tic Tac Toe Game</p>

    <section class="scoreboard" aria-label="Game scores">
      <div><div class="score-label">Player X</div><div class="score" id="scoreX">0</div></div>
      <div><div class="score-label">Draws</div><div class="score" id="draws">0</div></div>
      <div><div class="score-label">Player O</div><div class="score" id="scoreO">0</div></div>
    </section>

    <p id="status" aria-live="polite">Player X's turn</p>

    <section class="board" id="board" aria-label="Tic Tac Toe board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </section>

    <div class="actions">
      <button class="action" id="restart">↻ Restart Game</button>
      <button class="action secondary" id="resetScores">Reset Scores</button>
    </div>

    <footer>Made with ❤️ | TicXPlay</footer>
  </main>

  <script>
    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");
    const scoreX = document.getElementById("scoreX");
    const scoreO = document.getElementById("scoreO");
    const draws = document.getElementById("draws");

    let board = Array(9).fill("");
    let currentPlayer = "X";
    let gameActive = true;
    const scores = { X: 0, O: 0, draws: 0 };

    const winningCombinations = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    cells.forEach((cell) => {
      cell.addEventListener("click", () => {
        const index = Number(cell.dataset.index);
        if (!gameActive || board[index] !== "") return;

        board[index] = currentPlayer;
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer.toLowerCase());
        cell.disabled = true;

        const winningCombo = winningCombinations.find(combo =>
          combo.every(i => board[i] === currentPlayer)
        );

        if (winningCombo) {
          statusText.textContent = `🎉 Player ${currentPlayer} wins!`;
          scores[currentPlayer]++;
          winningCombo.forEach(i => cells[i].style.background = "#166534");
          gameActive = false;
          updateScores();
          disableBoard();
          return;
        }

        if (board.every(value => value !== "")) {
          statusText.textContent = "🤝 It's a draw!";
          scores.draws++;
          gameActive = false;
          updateScores();
          return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Player ${currentPlayer}'s turn`;
      });
    });

    function disableBoard() {
      cells.forEach(cell => { cell.disabled = true; });
    }

    function updateScores() {
      scoreX.textContent = scores.X;
      scoreO.textContent = scores.O;
      draws.textContent = scores.draws;
    }

    function restartGame() {
      board = Array(9).fill("");
      currentPlayer = "X";
      gameActive = true;
      cells.forEach(cell => {
        cell.textContent = "";
        cell.disabled = false;
        cell.className = "cell";
        cell.style.background = "";
      });
      statusText.textContent = "Player X's turn";
    }

    document.getElementById("restart").addEventListener("click", restartGame);
    document.getElementById("resetScores").addEventListener("click", () => {
      scores.X = 0;
      scores.O = 0;
      scores.draws = 0;
      updateScores();
      restartGame();
    });
  </script>
</body>
</html>.
